# ─────────────────────────────────────────────────────────────
# 本机端口暴露。docker compose 会自动加载本文件。
#
# 8896 是按宿主机现状挑的空闲端口（88xx 段其余多被其他项目的
# Traefik 占用）。如需改动，设置 WEB_PORT 环境变量即可，
# compose 与 Vite 的 HMR clientPort 会一起跟着变。
#
# 这是开发者个人文件，可以随意改。
# ─────────────────────────────────────────────────────────────

services:
  web:
    ports:
      - '${WEB_PORT:-8896}:5173'
