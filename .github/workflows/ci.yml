name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # build 内部已包含 tsc -b --noEmit，
      # 且会先生成 routeTree.gen.ts，所以放在 lint 之后单独跑。
      - run: pnpm build
