# 算法演示站 —— 纯静态 SPA，需要 HTML5 history fallback，
# 否则直接访问 /boids 这类路由会 404。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # index.html 不缓存，发版后首次刷新即可生效。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Vite 产物带内容哈希，可以长期不可变缓存。
    location ~* \.(js|css|woff2?|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
